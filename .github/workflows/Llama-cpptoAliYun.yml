name: Pull llama.cpp → Push to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 拉取带CUDA的server镜像（生产推理首选，支持GPU加速）
      - name: Pull llama.cpp server-cuda image
        run: docker pull ghcr.io/ggml-org/llama.cpp:server-cuda

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Tag and Push to ACR
        run: |
          docker tag ghcr.io/ggml-org/llama.cpp:server-cuda crpi-79o3tt0rozrf74vm.cn-chengdu.personal.cr.aliyuncs.com/momings/mmshare:llama.cpp-server-cuda
          docker push crpi-79o3tt0rozrf74vm.cn-chengdu.personal.cr.aliyuncs.com/momings/mmshare:llama.cpp-server-cuda
